name: Feature Request
description: Propose a new feature or enhancement
labels: ["enhancement", "triage"]
body:
  - type: markdown
    attributes:
      value: |
        Thanks for suggesting a feature. Please check the [product spec](docs/product-spec.md) and [roadmap](docs/roadmap.md) first to see if it's already planned.
  - type: textarea
    id: problem
    attributes:
      label: Problem Statement
      description: What problem does this feature solve?
    validations:
      required: true
  - type: textarea
    id: solution
    attributes:
      label: Proposed Solution
      description: Describe the solution you'd like.
    validations:
      required: true
  - type: textarea
    id: alternatives
    attributes:
      label: Alternatives Considered
      description: What alternatives have you considered?
  - type: dropdown
    id: component
    attributes:
      label: Component
      description: Which part of Ironlox would this affect?
      options:
        - Web App (Next.js dashboard)
        - Browser Extension
        - API / Backend
        - Crypto library
        - Marketing site
        - Multiple / Cross-cutting
    validations:
      required: true
  - type: textarea
    id: context
    attributes:
      label: Additional Context
      description: Anything else we should know?
